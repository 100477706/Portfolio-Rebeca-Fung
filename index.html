<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebeca Fung - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navegación (aparece después de la portada) -->
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <div class="logo">Rebeca Fung</div>
            <ul class="nav-menu">
                <li><a href="#inicio" class="nav-link">Inicio</a></li>
                <li><a href="#fotografia" class="nav-link">Fotografía</a></li>
                <li><a href="#contacto" class="nav-link">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero/Portada -->
    <section class="hero" id="inicio">
        <div class="hero-content">
            <h1 class="hero-title">Rebeca Fung</h1>
            <p class="hero-subtitle">Fotografía Profesional</p>
            <div class="hero-divider"></div>
            <p class="hero-description">Capturando momentos, creando historias</p>
            <button class="cta-button" onclick="scrollToSection('#fotografia')">Explorar Trabajo</button>
        </div>
        <div class="scroll-indicator">
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </section>

    <!-- Sección de Fotografía -->
    <section class="fotografia" id="fotografia">
        <div class="container">
            <h2 class="section-title">Mi Trabajo</h2>
            
            <!-- Bloque Eventos -->
            <div class="foto-block">
                <h3 class="block-title">Eventos</h3>
                <div class="carrusel-container">
                    <div class="carrusel" id="carrusel-eventos">
                        <img src="https://via.placeholder.com/600x400/FF6B9D/FFFFFF?text=Evento+1" alt="Evento 1" class="carrusel-img">
                        <img src="https://via.placeholder.com/600x400/C06C84/FFFFFF?text=Evento+2" alt="Evento 2" class="carrusel-img">
                        <img src="https://via.placeholder.com/600x400/6C5B7B/FFFFFF?text=Evento+3" alt="Evento 3" class="carrusel-img">
                        <img src="https://via.placeholder.com/600x400/355C7D/FFFFFF?text=Evento+4" alt="Evento 4" class="carrusel-img">
                    </div>
                    <button class="carrusel-btn prev" onclick="previousSlide('carrusel-eventos')">❮</button>
                    <button class="carrusel-btn next" onclick="nextSlide('carrusel-eventos')">❯</button>
                    <div class="carrusel-indicators" id="indicators-eventos"></div>
                </div>
            </div>

            <!-- Bloque Paisajes -->
            <div class="foto-block">
                <h3 class="block-title">Paisajes</h3>
                <div class="carrusel-container">
                    <div class="carrusel" id="carrusel-paisajes">
                        <img src="https://via.placeholder.com/600x400/1ABC9C/FFFFFF?text=Paisaje+1" alt="Paisaje 1" class="carrusel-img">
                        <img src="https://via.placeholder.com/600x400/16A085/FFFFFF?text=Paisaje+2" alt="Paisaje 2" class="carrusel-img">
                        <img src="https://via.placeholder.com/600x400/27AE60/FFFFFF?text=Paisaje+3" alt="Paisaje 3" class="carrusel-img">
                        <img src="https://via.placeholder.com/600x400/229954/FFFFFF?text=Paisaje+4" alt="Paisaje 4" class="carrusel-img">
                    </div>
                    <button class="carrusel-btn prev" onclick="previousSlide('carrusel-paisajes')">❮</button>
                    <button class="carrusel-btn next" onclick="nextSlide('carrusel-paisajes')">❯</button>
                    <div class="carrusel-indicators" id="indicators-paisajes"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Sección de Contacto -->
    <section class="contacto" id="contacto">
        <div class="container">
            <h2 class="section-title">Contáctame</h2>
            <div class="contacto-content">
                <form class="contacto-form" id="contactoForm" action="https://formspree.io/f/xvgzqqdj" method="POST">
                    <div class="form-group">
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Tu email" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="telefono" name="telefono" placeholder="Tu teléfono">
                    </div>
                    <div class="form-group">
                        <input type="text" id="asunto" name="asunto" placeholder="Asunto" required>
                    </div>
                    <div class="form-group">
                        <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Enviar Mensaje</button>
                </form>
                <div class="contacto-info">
                    <div class="info-item">
                        <h4>Email</h4>
                        <p id="email-display">contact@example.com</p>
                    </div>
                    <div class="info-item">
                        <h4>Localización</h4>
                        <p>Tu localización aquí</p>
                    </div>
                </div>
            </div>
            <div id="form-message" class="form-message"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Rebeca Fung. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
